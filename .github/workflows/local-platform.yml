name: Local platform

on:
  push:
    paths:
      - compose.yaml
      - backend/**
      - frontend/**
      - infra/**
      - tests/compose_smoke.py
      - .github/workflows/local-platform.yml
  pull_request:
    paths:
      - compose.yaml
      - backend/**
      - frontend/**
      - infra/**
      - tests/compose_smoke.py
      - .github/workflows/local-platform.yml

permissions:
  contents: read

jobs:
  local-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend development dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Check Python formatting and lint
        run: |
          ruff check --config backend/pyproject.toml backend tests/compose_smoke.py
          ruff format --check --config backend/pyproject.toml backend tests/compose_smoke.py
      - name: Test backend health behavior
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Exercise isolated local platform
        run: python tests/compose_smoke.py
