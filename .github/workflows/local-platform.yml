name: Local platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: registry_test
          POSTGRES_PASSWORD: registry-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Install simulator MQTT dependency
        run: python -m pip install --require-hashes -r simulator/requirements.txt
      - name: Lint Python
        run: python -m ruff check --config backend/pyproject.toml backend simulator tests
      - name: Check Python formatting
        run: python -m ruff format --check --config backend/pyproject.toml backend simulator tests
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Run API simulator tests
        working-directory: simulator
        run: python -m unittest discover -s tests -v
      - name: Run shared QA fixture and CLI tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify registry and telemetry against PostgreSQL
        working-directory: backend
        env:
          REGISTRY_TEST_DATABASE_URL: postgresql://registry_test:registry-test-only@127.0.0.1:5432/postgres
        run: python -m unittest discover -s tests/integration -v

  frontend:
    name: Frontend checks, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript and formatting
        run: npm run check
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  local-platform:
    name: Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install simulator MQTT dependency
        run: python -m pip install --require-hashes -r simulator/requirements.txt
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Exercise isolated local platform
        run: python tests/compose_smoke.py

  gateway:
    name: Gateway build (when implemented)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report missing gateway project
        if: ${{ hashFiles('gateway/CMakeLists.txt') == '' }}
        run: echo "Gateway build skipped because gateway/CMakeLists.txt is not implemented." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure gateway
        if: ${{ hashFiles('gateway/CMakeLists.txt') != '' }}
        run: cmake -S gateway -B gateway/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON
      - name: Build gateway
        if: ${{ hashFiles('gateway/CMakeLists.txt') != '' }}
        run: cmake --build gateway/build --parallel 2
